[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "takopy"
version = "0.2.0"
description = "Create Jira tickets from your shell — or from Claude Code session context."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Minsung Kang" }]
keywords = ["jira", "atlassian", "cli", "ticket", "issue-tracker", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Utilities",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
    # 상한을 두는 건 이것뿐이다. 선언된 저장소가 사라졌고(404) 릴리스도 2026-03 에
    # 사흘간 나오고 멈춘 단독 저자 패키지인데, markdown→ADF 라는 핵심 경로를 맡고 있다.
    # 예고 없는 major 파손을 사용자 설치 시점이 아니라 여기서 막는다.
    "md-to-adf>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/nonasking/tako"
Repository = "https://github.com/nonasking/tako"
Issues = "https://github.com/nonasking/tako/issues"

[project.scripts]
tako = "tako.main:run"

[tool.setuptools.packages.find]
include = ["tako*"]

[tool.setuptools.package-data]
tako = ["templates/*.md", "commands/*.md"]
